name: EaglerSoccer
version: '1.5.0'
main: org.pawling.eaglersoccer.EaglerSoccerPlugin
api-version: '1.21.11'
author: Pawling CSD Game Development
description: Legacy-client-compatible soccer field and ball physics for the classroom Eaglercraft server.

commands:
  soccer:
    description: Start or join a soccer lobby; operators can also use administration tools
    usage: /soccer
  leave:
    description: Leave the soccer field and return to the protected entrance pad
    usage: /leave

permissions:
  eaglersoccer.admin:
    description: Allows EaglerSoccer administration commands
    default: op
