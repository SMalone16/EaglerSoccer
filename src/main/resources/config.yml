# World in which the field is created.
world: world

# The field center is placed this many blocks north (-Z) of world spawn.
distance-north-of-spawn: 100

# Compact classroom pitch. Odd dimensions keep midfield exactly centered.
# This is significantly smaller than the original 25 x 41 field.
field-width: 13
field-length: 23

goal-width: 5
goal-height: 3

# Soccer simulation only runs while a player is near the pitch.
active-radius: 48
soccer-task-period-ticks: 2

# Field construction is spread across server ticks instead of one large synchronous burst.
build-blocks-per-tick: 180

# Contact kick tuning.
contact-radius: 1.20
base-kick-strength: 0.46
sprint-kick-bonus: 0.12
movement-kick-scale: 0.80
maximum-kick-strength: 0.92
kick-cooldown-ms: 220

# Generated by the plugin after field setup.
field:
  built: false
  layout-version: 2
  center-x: 0
  center-y: 0
  center-z: 0
