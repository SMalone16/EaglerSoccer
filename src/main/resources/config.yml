# World in which the field is created.
world: world

# The field center is placed this many blocks north (-Z) of world spawn.
distance-north-of-spawn: 100

# Odd dimensions make it easy to keep the center line exactly centered.
field-width: 25
field-length: 41

goal-width: 7
goal-height: 3

# Contact kick tuning.
contact-radius: 1.20
base-kick-strength: 0.46
sprint-kick-bonus: 0.12
movement-kick-scale: 0.80
maximum-kick-strength: 0.92
kick-cooldown-ms: 220

# Generated by the plugin after the first field setup.
field:
  built: false
  center-x: 0
  center-y: 0
  center-z: 0
