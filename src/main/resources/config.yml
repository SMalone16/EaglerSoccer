# World in which the field is created.
world: world

# The field center is placed this many blocks north (-Z) of world spawn.
distance-north-of-spawn: 100

# Compact classroom pitch.
field-width: 13
field-length: 23

goal-width: 5
goal-height: 3

# Soccer simulation runs only while a player is near the pitch.
active-radius: 48
soccer-task-period-ticks: 1

# Field construction is spread across server ticks.
build-blocks-per-tick: 180

# Ball interaction.
# Left-click = pass. Sprint + left-click = stronger shot.
# Only the closest player to the ball may control it.
interaction-radius: 2.35
pass-strength: 0.68
sprint-shot-strength: 1.02
pass-lift: 0.055
shot-lift: 0.10
shot-cooldown-ms: 180

# The shooter is briefly ignored by collision-stop logic so the ball can
# leave their feet instead of immediately stopping against them.
shooter-collision-grace-ms: 300

# Running into a moving ball stops it. Right-click also traps/stops it.
player-collision-radius: 0.78
minimum-moving-speed: 0.02

# Rolling friction. Higher values let the ball roll farther.
ground-friction-multiplier: 0.965
stop-speed-threshold: 0.012

# Generated by the plugin after field setup.
field:
  built: false
  layout-version: 2
  center-x: 0
  center-y: 0
  center-z: 0
